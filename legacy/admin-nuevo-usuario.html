<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Usuario - Admin</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <div style="display: flex; min-height: 100vh;">
        <aside style="width: 250px; background-color: #2c3e50; color: white; padding: 20px;">
            <h2>Sonido Vivo Admin</h2>
            <nav style="display: flex; flex-direction: column; gap: 15px; margin-top: 30px;">
                <a href="admin-home.html" style="color: white; text-decoration: none;">📊 Dashboard</a>
                <a href="admin-usuarios.html" style="color: white; text-decoration: none;">👥 Usuarios</a>
                <a href="admin-nuevo-usuario.html" style="color: white; text-decoration: none;">➕ Nuevo Usuario</a>
                <a href="admin-nuevo-producto.html" style="color: white; text-decoration: none;">📦 Nuevo Producto</a>
                <hr>
                <a href="index.html" style="color: #e74c3c; text-decoration: none;">🚪 Volver a la Tienda</a>
            </nav>
        </aside>

        <main style="flex: 1; padding: 40px; background-color: #f4f6f7;">
            <h2>NUEVO USUARIO</h2>
            <form id="form-admin-usuario" style="background: white; padding: 25px; border-radius: 8px; max-width: 600px;">
                <label>RUN (Sin puntos ni guion):</label>
                <input type="text" id="admin-run" placeholder="19011022K" required style="width: 100%; margin-bottom: 15px; padding: 8px;">

                <label>Nombre:</label>
                <input type="text" id="admin-nombre" maxlength="50" required style="width: 100%; margin-bottom: 15px; padding: 8px;">

                <label>Apellidos:</label>
                <input type="text" id="admin-apellidos" maxlength="100" required style="width: 100%; margin-bottom: 15px; padding: 8px;">

                <label>Correo Electrónico:</label>
                <input type="email" id="admin-correo" required style="width: 100%; margin-bottom: 15px; padding: 8px;">

                <label>Tipo de Usuario / Rol:</label>
                <select id="admin-tipo-usuario" required style="width: 100%; margin-bottom: 15px; padding: 8px;">
                    <option value="">-- Seleccione Rol --</option>
                    <option value="Administrador">Administrador</option>
                    <option value="Vendedor">Vendedor</option>
                    <option value="Cliente">Cliente</option>
                </select>

                <label>Dirección:</label>
                <input type="text" id="admin-direccion" maxlength="300" required style="width: 100%; margin-bottom: 15px; padding: 8px;">

                <button type="submit" style="background: #27ae60; color: white; border: none; padding: 10px 20px; cursor: pointer;">Guardar Usuario</button>
            </form>
        </main>
    </div>
    <script src="validaciones.js"></script>
</body>
</html>
