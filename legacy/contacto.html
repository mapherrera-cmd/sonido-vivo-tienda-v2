<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Sonido Vivo</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="logo">
            <h1>Sonido Vivo</h1>
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="productos.html">Productos</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="contacto.html">Contacto</a>
            <a href="carrito.html">🛒 Carrito (0)</a>
        </nav>
        <div class="acceso-usuarios">
            <a href="login.html">Iniciar sesión</a> | 
            <a href="registro.html">Registrar usuario</a>
        </div>
    </header>

    <!-- MAIN: Formulario de Contacto -->
    <main class="contenedor-formulario">
        <section class="caja-registro">
            <h2>Contáctanos</h2>
            <p>¿Tienes dudas sobre algún instrumento? Escríbenos.</p>
            
            <form action="#" method="POST">
                <div class="grupo-input">
                    <label for="nombre">Nombre Completo:</label>
                    <input type="text" id="nombre" required>
                </div>

                <div class="grupo-input">
                    <label for="email-contacto">Correo Electrónico:</label>
                    <input type="email" id="email-contacto" required>
                </div>

                <div class="grupo-input">
                    <label for="mensaje">Tu Mensaje:</label>
                    <textarea id="mensaje" rows="5" style="padding: 12px; border: 1px solid #ccc; border-radius: 4px; resize: vertical;" required></textarea>
                </div>

                <button type="submit" class="btn-formulario">Enviar Mensaje</button>
            </form>
        </section>
    </main>

    <!-- FOOTER -->
    <footer>
        <div class="footer-info">
            <p><strong>Sonido Vivo - Viña del Mar</strong></p>
        </div>
    </footer>

</body>
</html>
